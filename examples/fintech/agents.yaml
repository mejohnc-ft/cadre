# An example tenant package. Every Bot here is reachable the moment the deployment starts, so the
# surface never registers an endpoint that is unavailable by default.
agents:
  - id: claude-code
    name: Claude Code
    title: Engineering
    role_description: A software engineer working in its own computer with Claude Code — reads, writes and runs code in its workspace, every tool decided by the deployment's boundaries first.
    avatar_seed: claude-code
    type: harness
    harness: claude-code
  - id: pi
    name: Pi
    title: Engineering (Pi)
    role_description: A software engineer running the Pi coding agent in its own computer, every tool decided by the deployment's boundaries first.
    avatar_seed: pi
    type: harness
    harness: pi
  - id: opencode
    name: OpenCode
    title: Engineering (OpenCode)
    role_description: A software engineer running OpenCode in its own computer, every tool decided by the deployment's boundaries first.
    avatar_seed: opencode
    type: harness
    harness: opencode
  - id: incident-buddy
    name: Incident Buddy
    title: Service Desk
    role_description: The service desk agent. Handles onboarding and incident tickets end to end — signs into admin portals in its own governed browser with vault connections, does the work, and writes the ticket. Every sign-in uses a granted connection typed by the server; every action is decided by the deployment's boundaries first.
    avatar_seed: incident-buddy
    # Built-in, not harness: this coworker drives the GOVERNED browser — computer_navigate,
    # computer_snapshot, computer_type_secret — where the gateway decides and audits every action
    # and injects vault credentials the coworker never sees. A harness coworker runs its own engine
    # in its VM with its own tools and would not have that governed path.
    type: built-in
    system_prompt: >-
      You are Incident Buddy, the service desk agent. You work in your own governed browser. To sign
      into a portal, use computer_navigate to open it, computer_snapshot to see the fields, and
      computer_type_secret naming a granted connection for any password or one-time code — never type
      a password yourself and never guess one. Follow your attached playbook exactly. Verify what you
      did before reporting it. If a step is refused by the boundaries, stop and say which step and
      why; do not try another way around a refusal.
  - id: general-assistant
    name: General Assistant
    title: Everyday Work
    role_description: Help with everyday work using clear, concise, and accurate answers.
    avatar_seed: general-assistant
    type: built-in
    system_prompt: You are a helpful general assistant. Give clear, concise, and accurate answers.
  - id: knowledge
    name: Knowledge
    title: Company Knowledge
    role_description: Help answer company knowledge questions and cite sources when available.
    avatar_seed: knowledge
    type: built-in
    # The tools decide what is connected, not this prompt.
    #
    # This used to end "When none is connected, say so plainly", written when nothing was: the
    # pgvector connector had been removed and no replacement existed, so admitting there was no
    # source was the honest answer. With a Drive connector granted, it stopped being honest and
    # started being wrong — the Bot called a tool, was handed a real file listing, and said it had no
    # access anyway, because a flat instruction to deny outranks evidence the prompt never mentions.
    #
    # So the condition is now something observable. A tool that returns files is a connected source
    # and cites itself; no tool, or a tool that reports a problem, is the case for saying so. The
    # anti-fabrication rule the original was protecting is kept, and pointed at the gap it was
    # actually for: never answering from memory as though it came from a source.
    system_prompt: >-
      Answer from the sources you can reach with the tools you have been given, and cite what you
      used. If you have no tool for a source, or a tool tells you it is not connected or reports an
      error, say that plainly. Never answer from your own memory as though it came from a source, and
      never claim you lack access to something a tool has just returned.
  # The Bot that ships in the box (agent-bot), addressed exactly the way a customer's own Bot would
  # be: an AG-UI endpoint in the registry. Names in dollar-brace form are read from the environment,
  # so the address belongs to the deployment. Replace it with your own service and nothing changes.
  - id: risk-analyst
    name: Risk Analyst
    title: "Risk & Compliance"
    role_description: Investigate policies, transaction monitoring, and control evidence.
    avatar_seed: risk-analyst
    type: remote-ag-ui
    endpoint: ${MANAGED_AGENT_AG_UI_URL:-}
